name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vlang/setup-v@v1.4
        with:
          stable: true

      - name: Test vrpc runtime and vgen
        run: cd vrpc && v test .

      - name: Test users example (e2e)
        run: cd examples/users && v test .
