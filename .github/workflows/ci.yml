name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: brew install vlang

      - name: Test vrpc runtime and vgen
        env:
          LIBRARY_PATH: /opt/homebrew/lib:${{ env.LIBRARY_PATH }}
        run: cd vrpc && v test .

      - name: Test users example (e2e)
        env:
          LIBRARY_PATH: /opt/homebrew/lib:${{ env.LIBRARY_PATH }}
        run: cd examples/users && v test .
